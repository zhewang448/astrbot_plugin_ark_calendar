<style>
@font-face{font-family:ArkSerif;src:url('{{ font }}')}*{box-sizing:border-box}body{margin:0;width:760px;background:#eef1f1;color:#fff;font-family:ArkSerif,'Microsoft YaHei',serif}.card{min-height:340px;position:relative;overflow:hidden;display:grid;grid-template-columns:270px 1fr;background:#12191d;border-left:9px solid #00a8c6}.card:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 36px,#ffffff08 37px 38px,transparent 39px 72px);pointer-events:none}.portrait{position:relative;display:flex;align-items:end;justify-content:center;background:linear-gradient(160deg,#26343a,#0e1417)}.portrait:after{content:'P.R.T.S.';position:absolute;left:18px;bottom:16px;font:700 12px Consolas;color:#ffffff80;letter-spacing:3px}.avatar{width:238px;height:288px;object-fit:cover;object-position:center top}.copy{position:relative;padding:42px 38px;border-top:5px solid #f5c335}.k{font:700 12px Consolas;color:#72d3e2;letter-spacing:3px}.name{font-size:48px;line-height:1.15;margin:20px 0 22px}.line{height:1px;background:#ffffff35;margin-bottom:18px}.info{font-size:20px;line-height:1.9;color:#d3dcdf}.status{display:inline-block;margin-top:15px;padding:7px 11px;background:#f5c335;color:#171b1d;font-size:16px;font-weight:700}
</style><div class="card"><div class="portrait">{% if operator.avatar %}<img class="avatar" src="{{ operator.avatar }}">{% endif %}</div><div class="copy"><div class="k">OPERATOR BIRTHDAY RECORD</div><div class="name">{{ operator.name }}</div><div class="line"></div><div class="info">生日记录　{{ birthday }}<br>{% if operator.profession %}{{ operator.profession }}干员{% endif %}{% if operator.rarity %}　{{ operator.rarity }}★{% endif %}<br><span class="status">{{ status }}</span></div></div></div>
